# GitLab CI/CD Pipeline for "Don't Waste It"
image: node:20-alpine

stages:
  - install
  - test
  - build
  - docker-build

variables:
  NODE_ENV: "test"
  JWT_SECRET: "ci_testing_secret_key_12345"

# Cache node_modules across stages
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/
    - frontend/node_modules/

# Stage 1: Install Dependencies
install_dependencies:
  stage: install
  script:
    - cd backend && npm ci
    - cd ../frontend && npm ci

# Stage 2: Backend Automated Tests
backend_tests:
  stage: test
  script:
    - cd backend
    - npm ci
    - node src/server.js &
    - SERVER_PID=$!
    - sleep 4
    - node test-auth.js
    - node test-listings.js
    - node test-claims.js
    - node test-deliveries.js
    - node test-phase8.js
    - node test-phase9.js
    - kill $SERVER_PID

# Stage 3: Frontend Production Vite Build
frontend_build:
  stage: build
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

# Stage 4: Docker Container Build Check
docker_build:
  stage: docker-build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker build -t dontwasteit-backend:latest ./backend
    - docker build -t dontwasteit-frontend:latest ./frontend
  only:
    - main
    - master
