name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Backend Integration & E2E Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/dontwasteit
      JWT_SECRET: ci_production_jwt_secret_dontwasteit_key_2026
      API_URL: http://127.0.0.1:5000/api
      CORS_ORIGIN: '*'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify frontend build
        run: npm run build --prefix frontend

      - name: Start Backend Server
        run: |
          nohup node backend/src/server.js > backend.log 2>&1 &
          echo "Backend server started in background (PID: $!)"

      - name: Execute Full Integration Test Suite
        run: node backend/test-e2e.js

      - name: Dump Backend Logs on Failure
        if: failure()
        run: |
          echo "==================== Backend Server Logs ===================="
          cat backend.log || true
          echo "============================================================="

